name: Build and Release

on:
  workflow_dispatch:

jobs:
  get-data:
    name: Read Cargo TOML
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@master

      - name: Read Cargo TOML
        uses: SebRollen/toml-action@v1.0.2
        id: read_toml
        with:
          file: "./topaz/Cargo.toml"
          field: "package.version"

    outputs:
      version: ${{ steps.read_toml.outputs.value }}

  draft-release:
    name: Create a draft release
    runs-on: ubuntu-latest
    needs: get-data
    permissions:
      contents: write
    steps:
      - name: Push Tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          custom_tag: ${{ needs.get-data.outputs.version }}

      - name: Create Release
        uses: ncipollo/release-action@v1.14.0
        with:
          draft: true
          tag: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
    outputs:
      tag: ${{ steps.tag_version.outputs.new_tag }}

  build-cli:
    name: Build CLI on ${{ matrix.os }} for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: draft-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: topaz-x86_64.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact_name: topaz-x86_64-linux-musl
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: topaz-x86_64-macos
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: topaz-aarch64-macos

    steps:
      - name: Checkout
        uses: actions/checkout@master

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          target: ${{ matrix.target }}
          profile: minimal
          toolchain: nightly
          override: true

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: cli-${{ matrix.target }}

      - name: Build binary
        uses: houseabsolute/actions-rust-cross@v0
        with:
          command: "build"
          target: ${{ matrix.target }}
          args: "-p topaz --release"
          toolchain: "nightly"
          strip: true

      - name: Rename artifact
        shell: bash
        env:
          ARTIFACT_TARGET: ${{ matrix.target }}
          ARTIFACT_NAME: ${{ matrix.artifact_name }}
          RUNNER_KIND: ${{ runner.os }}
        run: |
          ARTIFACT_DIR="target/${ARTIFACT_TARGET}/release"
          if [ "$RUNNER_KIND" = "Windows" ]; then
            mv "${ARTIFACT_DIR}/topaz.exe" "${ARTIFACT_DIR}/${ARTIFACT_NAME}"
          else
            mv "${ARTIFACT_DIR}/topaz" "${ARTIFACT_DIR}/${ARTIFACT_NAME}"
          fi

      - name: Upload release asset
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
          asset_name: ${{ matrix.artifact_name }}
          tag: ${{ needs.draft-release.outputs.tag }}
          overwrite: true

  build-gui:
    name: Build GUI on ${{ matrix.os }} for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: draft-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: topaz-gui-x86_64.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: topaz-gui-x86_64-linux
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: topaz-gui-x86_64-macos
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: topaz-gui-aarch64-macos

    steps:
      - name: Checkout
        uses: actions/checkout@master

      - name: Install Linux GUI dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev \
            libwayland-dev \
            libfontconfig1-dev

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          target: ${{ matrix.target }}
          profile: minimal
          toolchain: nightly
          override: true

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: gui-${{ matrix.target }}

      - name: Build binary
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: cargo build -p topaz-gui --release --target "$BUILD_TARGET"

      - name: Rename artifact
        shell: bash
        env:
          ARTIFACT_TARGET: ${{ matrix.target }}
          ARTIFACT_NAME: ${{ matrix.artifact_name }}
          RUNNER_KIND: ${{ runner.os }}
        run: |
          ARTIFACT_DIR="target/${ARTIFACT_TARGET}/release"
          if [ "$RUNNER_KIND" = "Windows" ]; then
            mv "${ARTIFACT_DIR}/topaz-gui.exe" "${ARTIFACT_DIR}/${ARTIFACT_NAME}"
          else
            mv "${ARTIFACT_DIR}/topaz-gui" "${ARTIFACT_DIR}/${ARTIFACT_NAME}"
          fi

      - name: Upload release asset
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
          asset_name: ${{ matrix.artifact_name }}
          tag: ${{ needs.draft-release.outputs.tag }}
          overwrite: true

  # ─────────────────────────────────────────────────────────────────
  # Android CLI builds (pure Rust, works via Termux / adb)
  # ─────────────────────────────────────────────────────────────────
  build-android-cli:
    name: Build Android CLI for ${{ matrix.target }}
    runs-on: ubuntu-latest
    needs: draft-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            artifact_name: topaz-aarch64-android
          - target: armv7-linux-androideabi
            artifact_name: topaz-armv7-android
          - target: x86_64-linux-android
            artifact_name: topaz-x86_64-android
          - target: i686-linux-android
            artifact_name: topaz-i686-android

    steps:
      - name: Checkout
        uses: actions/checkout@master

      - name: Install Rust nightly with Android targets
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          target: ${{ matrix.target }}
          profile: minimal
          override: true

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: cli-android-${{ matrix.target }}

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Build Android binary
        shell: bash
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          # cargo ndk wrapper sets proper linker envs
          cargo install cargo-ndk --locked || true
          cargo ndk -t ${{ matrix.target }} -o target/${{ matrix.target }}/release/ build --release -p topaz
          # cargo-ndk outputs .so? For bin crate it still outputs bin under target/<triple>/release/
          # Ensure binary exists, if not, fallback to direct cargo build (linker is configured by setup-ndk)
          if [ ! -f "target/${{ matrix.target }}/release/topaz" ]; then
            cargo build --release -p topaz --target ${{ matrix.target }}
          fi
          ls -lh target/${{ matrix.target }}/release/topaz*
          cp target/${{ matrix.target }}/release/topaz target/${{ matrix.target }}/release/${{ matrix.artifact_name }} || \
          cp target/${{ matrix.target }}/release/topaz.exe target/${{ matrix.target }}/release/${{ matrix.artifact_name }} || true

      - name: Upload release asset (Android CLI)
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
          asset_name: ${{ matrix.artifact_name }}
          tag: ${{ needs.draft-release.outputs.tag }}
          overwrite: true

  # ─────────────────────────────────────────────────────────────────
  # Android GUI APK build (eframe + NativeActivity, pure Rust)
  # ─────────────────────────────────────────────────────────────────
  build-android-gui:
    name: Build Android GUI APK
    runs-on: ubuntu-latest
    needs: draft-release
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@master

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK & build tools
        run: |
          sdkmanager --install "ndk;26.3.11579264" "build-tools;34.0.0" "platforms;android-34" "platform-tools" --verbose
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV

      - name: Install Linux GUI deps (host build still needs some libs for eframe build script)
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libssl-dev libwayland-dev libgtk-3-dev

      - name: Install Rust nightly with all Android targets
        uses: actions-rs/toolchain@v1
        with:
          toolchain: nightly
          target: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
          profile: minimal
          override: true

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: gui-android-apk-${{ hashFiles('topaz-gui/Cargo.toml') }}

      - name: Install cargo-apk and cargo-ndk
        run: |
          cargo install cargo-apk --locked || true
          cargo install cargo-ndk --locked || true
          cargo apk --version
          cargo ndk --version

      - name: Build APK (release, all ABIs)
        shell: bash
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_ROOT }}
        run: |
          # Build for all targets declared in package.metadata.android.build_targets
          cargo apk build -p topaz-gui --release --verbose
          find target -name "*.apk" -type f | head -n 20
          ls -R target/release/apk || true
          ls -R target/debug/apk || true

      - name: Rename and collect APK
        shell: bash
        run: |
          set -e
          APK=$(find target -name "*.apk" -type f | grep -E "release|debug" | head -n 1)
          if [ -z "$APK" ]; then
            echo "APK not found!"
            find target -name "*.apk"
            exit 1
          fi
          echo "Found APK: $APK"
          cp "$APK" Topaz-release.apk
          ls -lh Topaz-release.apk

      - name: Upload release asset (APK)
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./Topaz-release.apk
          asset_name: Topaz-android.apk
          tag: ${{ needs.draft-release.outputs.tag }}
          overwrite: true
