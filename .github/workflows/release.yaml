name: Build and Release

on:
  workflow_dispatch:

jobs:
  get-data:
    name: Read Cargo TOML
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@master

      - name: Read Cargo TOML
        uses: SebRollen/toml-action@v1.0.2
        id: read_toml
        with:
          file: "./topaz/Cargo.toml"
          field: "package.version"

    outputs:
      version: ${{ steps.read_toml.outputs.value }}

  draft-release:
    name: Create a draft release
    runs-on: ubuntu-latest
    needs: get-data
    permissions:
      contents: write
    steps:
      - name: Push Tag
        id: tag_version
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          custom_tag: ${{ needs.get-data.outputs.version }}

      - name: Create Release
        uses: ncipollo/release-action@v1.14.0
        with:
          draft: true
          tag: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
    outputs:
      tag: ${{ steps.tag_version.outputs.new_tag }}

  build-cli:
    name: Build CLI on ${{ matrix.os }} for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: draft-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: topaz-x86_64.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact_name: topaz-x86_64-linux-musl
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: topaz-x86_64-macos
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: topaz-aarch64-macos

    steps:
      - name: Checkout
        uses: actions/checkout@master

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          target: ${{ matrix.target }}
          profile: minimal
          toolchain: nightly
          override: true

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: cli-${{ matrix.target }}

      - name: Build binary
        uses: houseabsolute/actions-rust-cross@v0
        with:
          command: "build"
          target: ${{ matrix.target }}
          args: "-p topaz --release"
          toolchain: "nightly"
          strip: true

      - name: Rename artifact
        shell: bash
        env:
          ARTIFACT_TARGET: ${{ matrix.target }}
          ARTIFACT_NAME: ${{ matrix.artifact_name }}
          RUNNER_KIND: ${{ runner.os }}
        run: |
          ARTIFACT_DIR="target/${ARTIFACT_TARGET}/release"
          if [ "$RUNNER_KIND" = "Windows" ]; then
            mv "${ARTIFACT_DIR}/topaz.exe" "${ARTIFACT_DIR}/${ARTIFACT_NAME}"
          else
            mv "${ARTIFACT_DIR}/topaz" "${ARTIFACT_DIR}/${ARTIFACT_NAME}"
          fi

      - name: Upload release asset
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
          asset_name: ${{ matrix.artifact_name }}
          tag: ${{ needs.draft-release.outputs.tag }}
          overwrite: true

  build-gui:
    name: Build GUI on ${{ matrix.os }} for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    needs: draft-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: topaz-gui-x86_64.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: topaz-gui-x86_64-linux
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: topaz-gui-x86_64-macos
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: topaz-gui-aarch64-macos

    steps:
      - name: Checkout
        uses: actions/checkout@master

      - name: Install Linux GUI dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev \
            libwayland-dev \
            libfontconfig1-dev

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          target: ${{ matrix.target }}
          profile: minimal
          toolchain: nightly
          override: true

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          key: gui-${{ matrix.target }}

      - name: Build binary
        shell: bash
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: cargo build -p topaz-gui --release --target "$BUILD_TARGET"

      - name: Rename artifact
        shell: bash
        env:
          ARTIFACT_TARGET: ${{ matrix.target }}
          ARTIFACT_NAME: ${{ matrix.artifact_name }}
          RUNNER_KIND: ${{ runner.os }}
        run: |
          ARTIFACT_DIR="target/${ARTIFACT_TARGET}/release"
          if [ "$RUNNER_KIND" = "Windows" ]; then
            mv "${ARTIFACT_DIR}/topaz-gui.exe" "${ARTIFACT_DIR}/${ARTIFACT_NAME}"
          else
            mv "${ARTIFACT_DIR}/topaz-gui" "${ARTIFACT_DIR}/${ARTIFACT_NAME}"
          fi

      - name: Upload release asset
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: target/${{ matrix.target }}/release/${{ matrix.artifact_name }}
          asset_name: ${{ matrix.artifact_name }}
          tag: ${{ needs.draft-release.outputs.tag }}
          overwrite: true
