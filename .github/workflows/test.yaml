name: Test

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  stress-test:
    name: Compile-and-decompile stress test (requires lune & luau)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install lune
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release download v0.10.5 --repo lune-org/lune --pattern "lune-0.10.5-linux-x86_64.zip" --output /tmp/lune.zip
          sudo unzip -o /tmp/lune.zip -d /usr/local/bin/
          rm /tmp/lune.zip
          /usr/local/bin/lune

      - name: Install latest official luau-compile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh release download --repo luau-lang/luau --pattern "luau-ubuntu.zip" --output /tmp/luau.zip
          sudo unzip -o /tmp/luau.zip -d /usr/local/bin/
          
          # Explicitly mark all extracted luau binaries as executable
          sudo chmod +x /usr/local/bin/luau
          sudo chmod +x /usr/local/bin/luau-analyze
          sudo chmod +x /usr/local/bin/luau-ast
          sudo chmod +x /usr/local/bin/luau-compile
          
          rm /tmp/luau.zip

      - name: Build
        run: cargo build -p topaz --bin topaz

      - name: Run multi-compiler test suite
        env:
          TOPAZ_STRESS_REQUIRE_LUNE: "1"
          TOPAZ_STRESS_REQUIRE_LUAU: "1"
          RUST_BACKTRACE: "1"
        run: cargo test -p luau-lifter

  # ─────────────────────────────────────────────────────────
  # Android compatibility checks (pure Rust should compile)
  # ─────────────────────────────────────────────────────────
  android-check-cli:
    name: Check Android CLI targets compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust nightly with Android targets
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android, i686-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Cargo check CLI for Android
        run: |
          cargo check -p topaz --target aarch64-linux-android
          cargo check -p topaz --target armv7-linux-androideabi
          cargo check -p topaz --target x86_64-linux-android

  android-check-gui:
    name: Check Android GUI compiles (eframe + NativeActivity)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust nightly with Android targets
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-linux-android, x86_64-linux-android

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Android Platform 30 Native
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-30"

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26d
          add-to-path: false

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
          
      - name: Configure NDK environment variables
        run: |
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          echo "NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          export TOOLCHAIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin

      - name: Verify NDK installation
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          ls "$ANDROID_NDK_HOME/source.properties" 2>/dev/null && echo "✅ source.properties found" || echo "❌ source.properties MISSING"

      - name: Cargo check GUI for Android
        run: |
          cargo ndk -t aarch64-linux-android --platform 30 -- check -p topaz-gui
          cargo ndk -t x86_64-linux-android --platform 30 -- check -p topaz-gui          

      - name: Validate Android metadata exists
        run: |
          test -f topaz-gui/Cargo.toml
          grep -q "package.metadata.android" topaz-gui/Cargo.toml && echo "✅ Android metadata present"
          ls -lh topaz-gui/src/lib.rs

      - name: Validate wakelock & notification JNI functions compile
        run: |
          echo "=== Verifying wakelock functions ==="
          grep -q "pub fn acquire_wakelock" topaz-gui/src/android.rs && echo "  ✅ acquire_wakelock"
          grep -q "pub fn acquire_partial_wakelock" topaz-gui/src/android.rs && echo "  ✅ acquire_partial_wakelock"
          grep -q "pub fn release_wakelock" topaz-gui/src/android.rs && echo "  ✅ release_wakelock"
          grep -q "pub fn is_wakelock_held" topaz-gui/src/android.rs && echo "  ✅ is_wakelock_held"
          grep -q "wake_lock_level" topaz-gui/src/android.rs && echo "  ✅ wake_lock_level constants"

          echo ""
          echo "=== Verifying notification functions ==="
          grep -q "pub fn create_notification_channel" topaz-gui/src/android.rs && echo "  ✅ create_notification_channel"
          grep -q "pub fn show_notification" topaz-gui/src/android.rs && echo "  ✅ show_notification"
          grep -q "pub fn cancel_notification" topaz-gui/src/android.rs && echo "  ✅ cancel_notification"
          grep -q "pub fn cancel_all_notifications" topaz-gui/src/android.rs && echo "  ✅ cancel_all_notifications"
          grep -q "notification_importance" topaz-gui/src/android.rs && echo "  ✅ notification_importance constants"

          echo ""
          echo "=== Verifying server integration ==="
          grep -q "acquire_partial_wakelock" topaz-gui/src/server.rs && echo "  ✅ server uses acquire_partial_wakelock"
          grep -q "release_wakelock" topaz-gui/src/server.rs && echo "  ✅ server uses release_wakelock"
          grep -q "show_notification" topaz-gui/src/server.rs && echo "  ✅ server uses show_notification"
          grep -q "cancel_notification" topaz-gui/src/server.rs && echo "  ✅ server uses cancel_notification"
          grep -q "create_notification_channel" topaz-gui/src/server.rs && echo "  ✅ server uses create_notification_channel"

          echo ""
          echo "=== Verifying Cargo.toml permissions ==="
          grep -q "WAKE_LOCK" topaz-gui/Cargo.toml && echo "  ✅ WAKE_LOCK permission declared"
          grep -q "POST_NOTIFICATIONS" topaz-gui/Cargo.toml && echo "  ✅ POST_NOTIFICATIONS permission declared"

          echo ""
          echo "=== Verifying Settings tab UI ==="
          grep -q "acquire_partial_wakelock" topaz-gui/src/lib.rs && echo "  ✅ Settings tab has wakelock controls"
          grep -q "show_notification" topaz-gui/src/lib.rs && echo "  ✅ Settings tab has notification controls"
          grep -q "cancel_all_notifications" topaz-gui/src/lib.rs && echo "  ✅ Settings tab has cancel-all button"

          echo ""
          echo "=== Verifying ongoing notification & keep-alive ==="
          grep -q "pub fn show_ongoing_notification" topaz-gui/src/android.rs && echo "  ✅ show_ongoing_notification (non-swipeable)"
          grep -q "pub fn enable_keepalive" topaz-gui/src/android.rs && echo "  ✅ enable_keepalive"
          grep -q "pub fn disable_keepalive" topaz-gui/src/android.rs && echo "  ✅ disable_keepalive"
          grep -q "show_ongoing_notification" topaz-gui/src/server.rs && echo "  ✅ server uses ongoing notification"

          echo ""
          echo "=== Verifying persistence module ==="
          grep -q "pub mod persist" topaz-gui/src/lib.rs && echo "  ✅ persist module declared"
          test -f topaz-gui/src/persist.rs && echo "  ✅ persist.rs exists"
          grep -q "pub fn load" topaz-gui/src/persist.rs && echo "  ✅ persist::load()"
          grep -q "pub fn save" topaz-gui/src/persist.rs && echo "  ✅ persist::save()"
          grep -q "keep_alive" topaz-gui/src/persist.rs && echo "  ✅ keep_alive in saved state"
          grep -q "save_state" topaz-gui/src/lib.rs && echo "  ✅ TopazApp::save_state()"

          echo ""
          echo "=== Verifying Cargo.toml ==="
          grep -q "serde_json" topaz-gui/Cargo.toml && echo "  ✅ serde_json dependency"
          grep -q "FOREGROUND_SERVICE" topaz-gui/Cargo.toml && echo "  ✅ FOREGROUND_SERVICE permission"
          grep -q "FOREGROUND_SERVICE_DATA_SYNC" topaz-gui/Cargo.toml && echo "  ✅ FOREGROUND_SERVICE_DATA_SYNC permission"
          grep -q "dirs" topaz-gui/Cargo.toml && echo "  ✅ dirs dependency (desktop config path)"

          echo ""
          echo "🎉 All validations passed!"
