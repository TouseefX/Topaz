[package]
name = "topaz-gui"
version = "0.1.0"
edition.workspace = true
authors.workspace = true

[lib]
name = "topaz_gui"
crate-type = ["cdylib", "rlib"]

[dependencies]
cfg = { path = "../cfg" }
lua51-lifter = { path = "../lua51-lifter" }
luau-lifter = { path = "../luau-lifter" }
axum = "0.8"
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.42", features = ["rt", "rt-multi-thread", "net", "sync", "macros"] }

eframe = { version = "0.31", default-features = false, features = ["glow", "wayland", "default_fonts", "x11", "web_screen_reader"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = "0.15"
eframe = { version = "0.31", features = ["accesskit"] }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.13"
winit = { version = "0.30", features = ["android-native-activity"] }
eframe = { version = "0.31", features = ["android-native-activity"] }
log = "0.4"
# --- Android enhancements ---
jni = "0.21"
ndk-context = "0.1"
anyhow = "1.0"

[package.metadata.android]
package = "com.exec.topaz"
apk_name = "Topaz"
build_targets = ["aarch64-linux-android", "armv7-linux-androideabi", "x86_64-linux-android"]
min_sdk_version = 24
target_sdk_version = 34
compile_sdk_version = 34
manifest_template = "android/src/main/AndroidManifest.xml"

# --- Permissions ---
[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"
max_sdk_version = 32

[[package.metadata.android.uses_permission]]
name = "android.permission.WRITE_EXTERNAL_STORAGE"
max_sdk_version = 29

[[package.metadata.android.uses_permission]]
name = "android.permission.MANAGE_EXTERNAL_STORAGE"

[[package.metadata.android.uses_permission]]
name = "android.permission.POST_NOTIFICATIONS"

[[package.metadata.android.uses_permission]]
name = "android.permission.WAKE_LOCK"

# Required for foreground service on Android 9+
[[package.metadata.android.uses_permission]]
name = "android.permission.FOREGROUND_SERVICE"

# Required for foreground service dataSync type on Android 14+
[[package.metadata.android.uses_permission]]
name = "android.permission.FOREGROUND_SERVICE_DATA_SYNC"

# --- Features ---
[[package.metadata.android.uses_feature]]
name = "android.hardware.touchscreen"
required = false

# --- Application Configuration ---
[package.metadata.android.application]
label = "Topaz"
# NOTE: Commented out icon temporarily until resource directory is configured
# icon = "@mipmap/ic_launcher"

# --- Main Activity ---
[[package.metadata.android.application.activity]]
name = "android.app.NativeActivity"
config_changes = "orientation|keyboardHidden|screenSize|screenLayout|smallestScreenSize|uiMode|density"
exported = true

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.MAIN"]
categories = ["android.intent.category.LAUNCHER"]

[[package.metadata.android.application.activity.meta_data]]
name = "android.app.lib_name"
value = "topaz_gui"

[[package.metadata.android.application.activity.meta_data]]
name = "android.requestLegacyExternalStorage"
value = "true"

[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.VIEW", "android.intent.action.EDIT", "android.intent.action.SEND"]
categories = ["android.intent.category.DEFAULT", "android.intent.category.BROWSABLE"]
data_mime_type = ["*/*"]
