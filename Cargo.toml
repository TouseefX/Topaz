[workspace]
resolver = "2"
members = [
    "cfg",
    "ast",
    "lua51-lifter",
    "lua51-deserializer",
    "luau-lifter",
    "restructure",
    "luau-worker",
    "web-server",
    "updater",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = [
    "h0rizondev <h0rizondev@proton.me>",
    "Mathias Pedersen <mathias.pedersen834@gmail.com>",
    "Jujhar Singh <jujharsmc@gmail.com>",
    "Amit Bashan <amit.bashan@icloud.com>",
]

[workspace.dependencies]
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
colored = "2"

[profile.release]
debug = true
lto = true
# strip = true
# panic = "abort"